name: Deploy to GitHub Pages

on:
    push:
        branches:
            - demos
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            #
            # Build app1
            #
            - name: Install dependencies (gesture-recognition
              working-directory: apps/gesture-recognition
              run: npm install

            - name: Build gesture-recognition
              working-directory: apps/gesture-recognition
              run: npm run build

            #
            # Build app2
            #
            - name: Install dependencies (sleep-recognition)
              working-directory: apps/sleep-recognition
              run: npm install

            - name: Build sleep-recognition
              working-directory: apps/sleep-recognition
              run: npm run build

            #
            # Build app3
            #
            - name: Install dependencies (music-app)
              working-directory: apps/music-app
              run: npm install

            - name: Build music-app
              working-directory: apps/music-app
              run: npm run build

            #
            # Prepare deploy directory
            #
            - name: Create deploy structure
              run: |
                  rm -rf deploy
                  mkdir -p deploy/gesture-recognition
                  mkdir -p deploy/sleep-recognition
                  mkdir -p deploy/music-app
                  mkdir -p deploy/perlin
                  mkdir -p deploy/camera

            - name: Copy build outputs
              run: |
                  cp -r apps/homepage/* deploy/
                  cp -r apps/gesture-recognition/dist/* deploy/gesture-recognition/
                  cp -r apps/sleep-recognition/dist/* deploy/sleep-recognition/
                  cp -r apps/music-app/dist/* deploy/music-app/
                  cp -r apps/perlin/* deploy/perlin/
                  cp -r apps/camera/* deploy/camera/

            #
            # Deploy to gh-pages branch
            #
            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./deploy
                  force_orphan: true
